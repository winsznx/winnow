[project]
name = "winnow"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "open_clip_torch", "torch", "tabpfn==2.0.9", "scikit-learn", "lxml",
  "numpy", "pandas", "pyarrow", "opencv-python", "scipy",
]

[project.scripts]
winnow = "winnow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["winnow", "winnow.datasets"]
